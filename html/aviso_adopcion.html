<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo aviso adopción</title>
    <link rel="stylesheet" href="../css/portada.css">
</head>
<body>
    <h1><strong>¡Agrega un nuevo aviso de adopción!</strong></h1>
    <div class="navbar">
            <a class="navbar-page" href="portada.html">Página de incio</a>
            <a class="navbar-page" href="listado_aviso_adopcion.html">Ver listado de adopciones</a>
            <a class="navbar-page" href="estadistica.html">Estadistica</a>
    </div>
    <div>
        <p>Llena el siguiente formulario para publicar un nuevo aviso de adopción.</p>
        <form id="formulario_adopcion">
        <section>
        <h2>Lugar de entrega</h2>
            <label for="region">Región</label>
            <select name="region" id="region" required>
                <option value="">Seleccione una región</option></select>

            <label for="comuna">Comuna</label>
            <select name="comuna" id="comuna" required>
                <option value="">Seleccione una comuna</option></select>

            <label for="sector">Sector</label>
            <input type="text" id="sector" required>
        </section>
        </form>
    </div>

    <div>
        <form>
        <section>
        <h2>Contacto</h2>
            <label for="nombre">Nombre</label>
            <input type="text" minlength="3" maxlength="200" id="nombre" required>

            <label for="email">Email</label>
            <input type="email" maxlength="100" required id="email">

            <label>Número de telefono</label>
            <input type="tel" required id="telefono">
        <div id = mContacto_div>
            <label for="metodo_contacto">Método de contacto</label>
            <select name="metodo_contacto" id="metodo_contacto">
                <option value="none">Seleccione un método de contacto</option>
                <option value="whatsapp">Whatsapp</option>
                <option value="telgram">Telegram</option>
                <option value="x">X</option>
                <option value="instagram">Instagram</option>
                <option value="tiktok">Tik tok</option>
                <option value="otra">Otra</option>
            </select>
            <input type="text" name="contacto_detalle[]" placeholder="Ingrese su contacto" minlength="4" maxlength="50" required>
        </div>

            <button type="button" id="agregar-contacto">Agregar otro método</button>
        </section>
        </form>
    </div>

    <div>
        <form>
        <section>
        <h2>Información Mascota</h2>
            <label for="tipo_mascota">Tipo</label>
            <select name="tipo_mascota" id="tipo_mascota" required>
                <option value="">Seleccione el tipo de su mascota</option>
                <option value="">Perro</option>
                <option value="">Gato</option>
            </select>

            <label for="cantidad_mascota">Cantidad</label>
            <input type="number" name="cantidad_mascota" id="cantidad_mascota" required min="1" value = "1">

            <label for="edad_mascota">Edad</label>
            <input type="number" name="edad_mascota" id="edad_mascota" required min="1" value="1">

            <label for="u_medida">Unidad de medida</label>
            <select name="u_medida" id="u_medida" required>
                <option value="">Seleccione la unidad de medida de la edad</option>
                <option value="">Años</option>
                <option value="">Meses</option>
            </select>

            <label for="fecha_disponible">Fecha disponible</label>
            <input type="datetime-local" name="fecha_disponible" id="fecha_disponible" required>

            <label>Descripción</label>
            <textarea name="descripcion" cols="50" rows="10" id="descripcion"></textarea>
        <div id="foto_div">
            <label for="foto_mascota">Fotos</label>
            <input type="file" name="foto_mascota" id="foto_mascota" required>
        </div>
            <button id="boton_agregar_foto" type="button">Agregar otra foto</button>
        </section> 
        </form>
        <button id="boton_agregar_aviso">Agregar este aviso de adopción</button>
        <div id="confirmContainer"></div>
        <div id="boton_portada"></div>   
    </div>

<script src="../js/region_comuna.js"></script>
<script src="../js/validaciones_nuevo_aviso.js"></script>
</body>
</html>
